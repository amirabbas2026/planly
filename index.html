<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Planner</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f7f1e8;
    color:#222;
    transition:
        background-color .65s ease,
        color .65s ease;
}

/* ================= THEME TRANSITION ================= */

.theme-transition{
    position:fixed;
    width:20px;
    height:20px;
    border-radius:50%;
    pointer-events:none;
    z-index:99999;

    background:#101010;

    transform:translate(-50%,-50%) scale(0);
    opacity:0;

    transition:
        transform .85s cubic-bezier(.22,1,.36,1),
        opacity .25s ease;

    box-shadow:
        0 0 35px rgba(255,255,255,.08),
        0 0 80px rgba(216,185,139,.12);
}

.theme-transition.active{
    transform:translate(-50%,-50%) scale(180);
    opacity:1;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    right:0;
    top:0;
    width:250px;
    height:100vh;
    background:#171717;
    color:white;
    padding:25px 18px;
    z-index:1000;
    display:flex;
    flex-direction:column;
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:40px;
}

.logo span{
    color:#d8b98b;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.menu button{
    border:0;
    background:transparent;
    color:#aaa;
    padding:14px;
    border-radius:14px;
    cursor:pointer;
    font-size:14px;
    text-align:right;
    transition:.25s;
}

.menu button:hover,
.menu button.active{
    background:#292929;
    color:#fff;
}

.menu button span{
    margin-left:10px;
}

.theme-btn{
    margin-top:auto;
    width:100%;
    border:1px solid #444;
    background:#222;
    color:white;
    padding:12px;
    border-radius:12px;
    cursor:pointer;

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

.theme-btn:hover{
    transform:translateY(-2px);
    background:#2c2c2c;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.theme-btn:active{
    transform:scale(.94);
}

/* ================= MAIN ================= */

.main{
    margin-right:250px;
    width:calc(100% - 250px);
    min-height:100vh;
    padding:25px;
}

/* ================= TOPBAR ================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.topbar h1{
    font-size:28px;
}

.date-pill{
    background:white;
    padding:10px 18px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
    white-space:nowrap;

    transition:
        background-color .5s ease,
        color .5s ease,
        box-shadow .5s ease;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border-radius:20px;
    padding:22px;
    min-width:0;
    box-shadow:0 5px 25px rgba(0,0,0,.05);

    transition:
        background-color .5s ease,
        color .5s ease,
        box-shadow .5s ease,
        transform .25s ease;
}

.stat-card:hover{
    transform:translateY(-3px);
}

.stat-card h3{
    font-size:14px;
    color:#777;
    margin-bottom:12px;
}

.stat-card strong{
    font-size:30px;
}

/* ================= DASHBOARD ================= */

.dashboard{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:20px;
}

.panel{
    background:white;
    border-radius:22px;
    padding:22px;
    box-shadow:0 5px 25px rgba(0,0,0,.05);
    min-width:0;

    transition:
        background-color .5s ease,
        color .5s ease,
        box-shadow .5s ease;
}

.panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.panel-title h2{
    font-size:19px;
}

/* ================= BUTTONS ================= */

.primary-btn{
    border:0;
    background:#171717;
    color:white;
    padding:11px 17px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-2px);
    background:#333;
}

/* ================= TASKS ================= */

.task-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.task{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    background:#fafafa;
    border-radius:14px;

    transition:
        background-color .45s ease,
        color .45s ease;
}

.task input{
    width:19px;
    height:19px;
    cursor:pointer;
}

.task-text{
    flex:1;
    min-width:0;
    overflow-wrap:anywhere;
}

.task.done .task-text{
    text-decoration:line-through;
    opacity:.45;
}

/* ================= PROGRESS ================= */

.progress-box{
    margin-bottom:22px;
}

.progress-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
}

.progress{
    width:100%;
    height:10px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0;
    background:#171717;
    border-radius:20px;
    transition:.5s;
}

/* ================= CALENDAR ================= */

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.calendar div{
    min-height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    font-size:12px;
}

.calendar .day-name{
    font-weight:bold;
    color:#888;
}

.calendar .day{
    background:#f7f7f7;
    cursor:pointer;

    transition:
        background-color .35s ease,
        color .35s ease,
        transform .2s ease;
}

.calendar .day:hover{
    transform:scale(1.05);
}

.calendar .today{
    background:#171717;
    color:white;
}

.calendar .selected{
    outline:2px solid #d8b98b;
}

/* ================= HABITS ================= */

.habits{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.habit{
    background:#fafafa;
    padding:14px;
    border-radius:14px;

    transition:
        background-color .45s ease,
        color .45s ease;
}

.habit-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:9px;
}

.habit-bar{
    height:7px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
}

.habit-bar div{
    height:100%;
    width:0;
    background:#171717;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:3000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(450px,100%);
    background:white;
    border-radius:22px;
    padding:25px;

    transition:
        background-color .45s ease,
        color .45s ease;
}

.modal-box h2{
    margin-bottom:20px;
}

.modal-box input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    margin-bottom:15px;

    transition:
        background-color .4s ease,
        color .4s ease,
        border-color .4s ease;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    color:#999;
    padding:30px 10px;
}

/* ================= TABLET ================= */

@media(max-width:1100px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard{
        grid-template-columns:1fr;
    }
}

/* ================= MOBILE ================= */

@media(max-width:750px){

    body{
        padding-bottom:78px;
    }

    .sidebar{
        top:auto;
        bottom:0;
        right:0;
        width:100%;
        height:72px;
        padding:6px 8px;
        flex-direction:row;
        align-items:center;
        justify-content:center;
        border-radius:18px 18px 0 0;
    }

    .logo{
        display:none;
    }

    .menu{
        width:100%;
        height:100%;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:5px;
    }

    .menu button{
        padding:5px 2px;
        border-radius:12px;
        text-align:center;
        font-size:11px;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:3px;
    }

    .menu button span{
        margin:0;
        font-size:19px;
    }

    .theme-btn{
        position:absolute;
        bottom:82px;
        left:12px;
        width:44px;
        height:44px;
        padding:0;
        border-radius:50%;
        font-size:18px;
    }

    .main{
        margin-right:0;
        width:100%;
        padding:16px;
        padding-bottom:25px;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;
        gap:12px;
        margin-bottom:18px;
    }

    .topbar h1{
        font-size:22px;
    }

    .date-pill{
        width:100%;
        text-align:center;
        padding:10px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
        margin-bottom:15px;
    }

    .stat-card{
        padding:15px;
        border-radius:16px;
    }

    .stat-card h3{
        font-size:12px;
        margin-bottom:8px;
    }

    .stat-card strong{
        font-size:24px;
    }

    .dashboard{
        gap:14px;
    }

    .panel{
        padding:15px;
        border-radius:18px;
    }

    .panel-title{
        margin-bottom:15px;
    }

    .panel-title h2{
        font-size:16px;
    }

    .primary-btn{
        padding:9px 12px;
        font-size:12px;
    }

    .task{
        padding:12px;
        border-radius:12px;
    }

    .calendar{
        gap:4px;
    }

    .calendar div{
        min-height:34px;
        font-size:11px;
    }

    .habit{
        padding:12px;
    }
}

/* ================= SMALL MOBILE ================= */

@media(max-width:380px){

    .main{
        padding:12px;
    }

    .stats{
        gap:8px;
    }

    .stat-card{
        padding:12px;
    }

    .stat-card strong{
        font-size:21px;
    }

    .topbar h1{
        font-size:20px;
    }

    .panel{
        padding:12px;
    }

    .calendar div{
        min-height:30px;
        font-size:10px;
    }

    .menu button{
        font-size:9px;
    }

    .menu button span{
        font-size:17px;
    }
}

/* ================= DARK MODE ================= */

body.dark{
    background:#101010;
    color:#f5f5f5;
}

body.dark .panel,
body.dark .stat-card,
body.dark .date-pill,
body.dark .modal-box{
    background:#1b1b1b;
    color:#fff;
}

body.dark .task,
body.dark .habit,
body.dark .calendar .day{
    background:#242424;
}

body.dark .calendar .day-name{
    color:#aaa;
}

body.dark .progress,
body.dark .habit-bar{
    background:#333;
}

body.dark .progress-fill,
body.dark .habit-bar div{
    background:#fff;
}

body.dark .modal-box input{
    background:#222;
    color:white;
    border-color:#444;
}

/* ================= SOFT DARK TRANSITIONS ================= */

body.dark .stat-card h3{
    color:#aaa;
}

body.dark .empty{
    color:#777;
}

body.dark .primary-btn{
    background:#f5f5f5;
    color:#111;
}

body.dark .primary-btn:hover{
    background:#fff;
}

</style>
</head>

<body>

<!-- THEME ANIMATION -->
<div class="theme-transition" id="themeTransition"></div>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        Dream <span>Planner</span>
    </div>

    <nav class="menu">

        <button class="active" onclick="showSection('dashboard')">
            <span>⌂</span>
            داشبورد
        </button>

        <button onclick="showSection('tasks')">
            <span>✓</span>
            کارها
        </button>

        <button onclick="showSection('calendar')">
            <span>□</span>
            تقویم
        </button>

        <button onclick="showSection('habits')">
            <span>↗</span>
            عادت‌ها
        </button>

    </nav>

    <button class="theme-btn" onclick="toggleTheme(event)" aria-label="تغییر تم">
        ◐
    </button>

</aside>

<!-- ================= MAIN ================= -->

<main class="main">

    <header class="topbar">

        <div>
            <h1>برنامه امروز من</h1>
        </div>

        <div class="date-pill" id="currentDate">
            ---
        </div>

    </header>

    <!-- ================= STATS ================= -->

    <section class="stats">

        <div class="stat-card">
            <h3>کل کارها</h3>
            <strong id="totalTasks">0</strong>
        </div>

        <div class="stat-card">
            <h3>انجام شده</h3>
            <strong id="completedTasks">0</strong>
        </div>

        <div class="stat-card">
            <h3>درصد پیشرفت</h3>
            <strong id="completionPercent">0%</strong>
        </div>

        <div class="stat-card">
            <h3>روزهای فعال</h3>
            <strong id="activeDays">0</strong>
        </div>

    </section>

    <!-- ================= DASHBOARD ================= -->

    <section class="dashboard">

        <!-- TASK PANEL -->

        <div class="panel" id="tasksPanel">

            <div class="panel-title">

                <h2>کارهای امروز</h2>

                <button class="primary-btn" onclick="openModal()">
                    + افزودن کار
                </button>

            </div>

            <div class="task-list" id="taskList">

                <div class="empty">
                    هنوز کاری اضافه نکرده‌ای
                </div>

            </div>

        </div>

        <!-- PROGRESS PANEL -->

        <div class="panel">

            <div class="panel-title">
                <h2>پیشرفت ماهانه</h2>
            </div>

            <div class="progress-box">

                <div class="progress-header">
                    <span>پیشرفت کلی</span>
                    <strong id="monthlyPercent">0%</strong>
                </div>

                <div class="progress">
                    <div class="progress-fill" id="monthlyProgress"></div>
                </div>

            </div>

            <div class="progress-box">

                <div class="progress-header">
                    <span>کارهای انجام‌شده</span>
                    <strong id="monthlyCompleted">0</strong>
                </div>

            </div>

        </div>

        <!-- CALENDAR -->

        <div class="panel" id="calendarPanel">

            <div class="panel-title">
                <h2>تقویم</h2>
            </div>

            <div class="calendar" id="calendar"></div>

        </div>

        <!-- HABITS -->

        <div class="panel" id="habitsPanel">

            <div class="panel-title">
                <h2>عادت‌های من</h2>
            </div>

            <div class="habits" id="habits">

                <div class="habit">

                    <div class="habit-top">
                        <span>برنامه‌ریزی روزانه</span>
                        <strong id="habit1Percent">0%</strong>
                    </div>

                    <div class="habit-bar">
                        <div id="habit1Bar"></div>
                    </div>

                </div>

                <div class="habit">

                    <div class="habit-top">
                        <span>انجام کارهای مهم</span>
                        <strong id="habit2Percent">0%</strong>
                    </div>

                    <div class="habit-bar">
                        <div id="habit2Bar"></div>
                    </div>

                </div>

            </div>

        </div>

    </section>

</main>

<!-- ================= MODAL ================= -->

<div class="modal" id="taskModal">

    <div class="modal-box">

        <h2>افزودن کار جدید</h2>

        <input
            type="text"
            id="taskInput"
            placeholder="مثلاً: مطالعه ۳۰ دقیقه"
            autocomplete="off"
        >

        <div class="modal-actions">

            <button class="primary-btn" onclick="addTask()">
                افزودن
            </button>

            <button
                class="primary-btn"
                style="background:#eee;color:#222"
                onclick="closeModal()"
            >
                لغو
            </button>

        </div>

    </div>

</div>

<script>

/* ================= DATA ================= */

let tasks = JSON.parse(
    localStorage.getItem("dreamPlannerTasks") || "[]"
);

let activeDays = Number(
    localStorage.getItem("dreamPlannerActiveDays") || 0
);


/* ================= DATE ================= */

function updateDate(){

    const now = new Date();

    const options = {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
    };

    document.getElementById("currentDate").textContent =
        now.toLocaleDateString("fa-IR",options);
}


/* ================= SAVE ================= */

function saveData(){

    localStorage.setItem(
        "dreamPlannerTasks",
        JSON.stringify(tasks)
    );

    localStorage.setItem(
        "dreamPlannerActiveDays",
        activeDays
    );
}


/* ================= RENDER TASKS ================= */

function renderTasks(){

    const list = document.getElementById("taskList");

    if(tasks.length === 0){

        list.innerHTML = `
            <div class="empty">
                هنوز کاری اضافه نکرده‌ای
            </div>
        `;

        updateStats();
        return;
    }

    list.innerHTML = "";

    tasks.forEach((task,index)=>{

        const item = document.createElement("div");

        item.className =
            "task " + (task.done ? "done" : "");

        item.innerHTML = `

            <input
                type="checkbox"
                ${task.done ? "checked" : ""}
                onchange="toggleTask(${index})"
            >

            <div class="task-text">
                ${escapeHTML(task.text)}
            </div>

            <button
                onclick="deleteTask(${index})"
                style="
                    border:0;
                    background:none;
                    color:#999;
                    cursor:pointer;
                    font-size:18px;
                "
            >
                ×
            </button>
        `;

        list.appendChild(item);

    });

    updateStats();
}


/* ================= ESCAPE ================= */

function escapeHTML(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* ================= ADD TASK ================= */

function addTask(){

    const input =
        document.getElementById("taskInput");

    const text = input.value.trim();

    if(!text) return;

    tasks.push({
        text:text,
        done:false,
        date:new Date().toISOString()
    });

    input.value = "";

    saveData();

    renderTasks();

    closeModal();
}


/* ================= TOGGLE ================= */

function toggleTask(index){

    tasks[index].done =
        !tasks[index].done;

    saveData();

    renderTasks();
}


/* ================= DELETE ================= */

function deleteTask(index){

    tasks.splice(index,1);

    saveData();

    renderTasks();
}


/* ================= STATS ================= */

function updateStats(){

    const total = tasks.length;

    const completed =
        tasks.filter(t=>t.done).length;

    const percent =
        total === 0
        ? 0
        : Math.round((completed / total) * 100);

    document.getElementById("totalTasks")
        .textContent = total;

    document.getElementById("completedTasks")
        .textContent = completed;

    document.getElementById("completionPercent")
        .textContent = percent + "%";

    document.getElementById("monthlyPercent")
        .textContent = percent + "%";

    document.getElementById("monthlyProgress")
        .style.width = percent + "%";

    document.getElementById("monthlyCompleted")
        .textContent = completed;

    document.getElementById("activeDays")
        .textContent = activeDays;

    document.getElementById("habit1Percent")
        .textContent = percent + "%";

    document.getElementById("habit1Bar")
        .style.width = percent + "%";

    document.getElementById("habit2Percent")
        .textContent = percent + "%";

    document.getElementById("habit2Bar")
        .style.width = percent + "%";
}


/* ================= MODAL ================= */

function openModal(){

    document
        .getElementById("taskModal")
        .classList.add("show");

    setTimeout(()=>{
        document
            .getElementById("taskInput")
            .focus();
    },100);
}


function closeModal(){

    document
        .getElementById("taskModal")
        .classList.remove("show");
}


document
    .getElementById("taskModal")
    .addEventListener("click",function(e){

        if(e.target === this){
            closeModal();
        }

    });


document
    .getElementById("taskInput")
    .addEventListener("keydown",function(e){

        if(e.key === "Enter"){
            addTask();
        }

        if(e.key === "Escape"){
            closeModal();
        }

    });


/* ================= CALENDAR ================= */

function generateCalendar(){

    const calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";

    const names = [
        "ش",
        "ی",
        "د",
        "س",
        "چ",
        "پ",
        "ج"
    ];

    names.forEach(name=>{

        const div =
            document.createElement("div");

        div.className = "day-name";

        div.textContent = name;

        calendar.appendChild(div);

    });

    const now = new Date();

    const year = now.getFullYear();
    const month = now.getMonth();

    const firstDay =
        new Date(year,month,1).getDay();

    const days =
        new Date(year,month + 1,0).getDate();

    for(let i=0;i<firstDay;i++){

        const empty =
            document.createElement("div");

        calendar.appendChild(empty);
    }

    for(let day=1;day<=days;day++){

        const div =
            document.createElement("div");

        div.className = "day";

        div.textContent = day;

        if(day === now.getDate()){
            div.classList.add("today");
        }

        div.onclick = ()=>{

            document
                .querySelectorAll(".calendar .selected")
                .forEach(x=>x.classList.remove("selected"));

            div.classList.add("selected");

        };

        calendar.appendChild(div);

    }
}


/* ================= SECTION NAVIGATION ================= */

function showSection(section){

    document
        .querySelectorAll(".menu button")
        .forEach(btn=>btn.classList.remove("active"));

    if(section === "dashboard"){

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

        document
            .querySelector(".menu button:nth-child(1)")
            .classList.add("active");
    }

    if(section === "tasks"){

        document
            .getElementById("tasksPanel")
            .scrollIntoView({
                behavior:"smooth"
            });

        document
            .querySelector(".menu button:nth-child(2)")
            .classList.add("active");
    }

    if(section === "calendar"){

        document
            .getElementById("calendarPanel")
            .scrollIntoView({
                behavior:"smooth"
            });

        document
            .querySelector(".menu button:nth-child(3)")
            .classList.add("active");
    }

    if(section === "habits"){

        document
            .getElementById("habitsPanel")
            .scrollIntoView({
                behavior:"smooth"
            });

        document
            .querySelector(".menu button:nth-child(4)")
            .classList.add("active");
    }
}


/* =====================================================
   FANTASY THEME TRANSITION
   ===================================================== */

function toggleTheme(event){

    const transition =
        document.getElementById("themeTransition");

    const button =
        document.querySelector(".theme-btn");

    const isDark =
        !document.body.classList.contains("dark");

    /*
        محل شروع افکت:
        دسکتاپ = محل دقیق دکمه
        موبایل = همان دکمه شناور
    */

    let x;
    let y;

    if(event && event.clientX && event.clientY){

        x = event.clientX;
        y = event.clientY;

    }else{

        const rect = button.getBoundingClientRect();

        x = rect.left + rect.width / 2;
        y = rect.top + rect.height / 2;

    }

    /*
        اگر حالت جدید Dark باشد:
        موج مشکی می‌شود.

        اگر حالت جدید Light باشد:
        موج کرم می‌شود.
    */

    transition.style.left = x + "px";
    transition.style.top = y + "px";

    transition.style.background =
        isDark
        ? "#101010"
        : "#f7f1e8";

    transition.style.boxShadow =
        isDark
        ? "0 0 45px rgba(255,255,255,.08), 0 0 100px rgba(216,185,139,.14)"
        : "0 0 45px rgba(216,185,139,.18), 0 0 100px rgba(247,241,232,.25)";

    /*
        reset animation
    */

    transition.classList.remove("active");

    void transition.offsetWidth;

    /*
        شروع موج
    */

    transition.classList.add("active");

    /*
        کمی بعد از شروع موج،
        تم اصلی تغییر می‌کند تا
        کاربر یک transition کاملاً نرم ببیند.
    */

    setTimeout(()=>{

        document.body.classList.toggle("dark");

        localStorage.setItem(
            "dreamPlannerDark",
            document.body.classList.contains("dark")
        );

    },180);

    /*
        حذف لایه بعد از پایان انیمیشن
    */

    setTimeout(()=>{

        transition.classList.remove("active");

    },900);
}


/* ================= LOAD THEME ================= */

function loadTheme(){

    const dark =
        localStorage.getItem("dreamPlannerDark");

    if(dark === "true"){

        document.body.classList.add("dark");

    }
}


/* ================= START ================= */

updateDate();

renderTasks();

generateCalendar();

loadTheme();
