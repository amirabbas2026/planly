<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Planner</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f7f1e8;
    color:#222;
    transition:background-color .15s ease,color .15s ease;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    position:fixed;
    right:0;
    top:0;
    width:250px;
    height:100vh;
    background:#171717;
    color:white;
    padding:25px 18px;
    z-index:1000;

    display:flex;
    flex-direction:column;
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:40px;
}

.logo span{
    color:#d8b98b;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.menu button{
    border:0;
    background:transparent;
    color:#aaa;
    padding:14px;
    border-radius:14px;
    cursor:pointer;
    font-size:14px;
    text-align:right;
    transition:.2s;
}

.menu button:hover,
.menu button.active{
    background:#292929;
    color:#fff;
}

.menu button span{
    margin-left:10px;
}


/* =====================================================
   THEME BUTTON
===================================================== */

.theme-btn{
    margin-top:auto;
    width:100%;
    border:1px solid #444;
    background:#222;
    color:white;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

.theme-btn:hover{
    background:#333;
}


/* =====================================================
   MAIN
===================================================== */

.main{
    margin-right:250px;
    width:calc(100% - 250px);
    min-height:100vh;
    padding:25px;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.topbar h1{
    font-size:28px;
}

.date-pill{
    background:white;
    padding:10px 18px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
    white-space:nowrap;
}


/* =====================================================
   STATS
===================================================== */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border-radius:20px;
    padding:22px;
    min-width:0;
    box-shadow:0 5px 25px rgba(0,0,0,.05);
}

.stat-card h3{
    font-size:14px;
    color:#777;
    margin-bottom:12px;
}

.stat-card strong{
    font-size:30px;
}


/* =====================================================
   DASHBOARD
===================================================== */

.dashboard{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:20px;
}

.panel{
    background:white;
    border-radius:22px;
    padding:22px;
    box-shadow:0 5px 25px rgba(0,0,0,.05);
    min-width:0;
}

.panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.panel-title h2{
    font-size:19px;
}


/* =====================================================
   BUTTONS
===================================================== */

.primary-btn{
    border:0;
    background:#171717;
    color:white;
    padding:11px 17px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-2px);
    background:#333;
}


/* =====================================================
   TASKS
===================================================== */

.task-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.task{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    background:#fafafa;
    border-radius:14px;
}

.task input{
    width:19px;
    height:19px;
    cursor:pointer;
    accent-color:#171717;
}

.task-text{
    flex:1;
    min-width:0;
    overflow-wrap:anywhere;
}

.task.done .task-text{
    text-decoration:line-through;
    opacity:.45;
}

.delete-task{
    border:0;
    background:none;
    color:#999;
    cursor:pointer;
    font-size:20px;
    padding:3px 7px;
    border-radius:8px;
}

.delete-task:hover{
    background:#eee;
    color:#222;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-box{
    margin-bottom:22px;
}

.progress-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
}

.progress{
    width:100%;
    height:10px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0;
    background:#171717;
    border-radius:20px;
    transition:.5s;
}


/* =====================================================
   CALENDAR
===================================================== */

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.calendar div{
    min-height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    font-size:12px;
}

.calendar .day-name{
    font-weight:bold;
    color:#888;
}

.calendar .day{
    background:#f7f7f7;
    cursor:pointer;
    transition:.15s;
}

.calendar .day:hover{
    transform:scale(1.04);
}

.calendar .today{
    background:#171717;
    color:white;
}

.calendar .selected{
    outline:2px solid #d8b98b;
}


/* =====================================================
   HABITS
===================================================== */

.habits{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.habit{
    background:#fafafa;
    padding:14px;
    border-radius:14px;
}

.habit-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:9px;
}

.habit-bar{
    height:7px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
}

.habit-bar div{
    height:100%;
    width:0;
    background:#171717;
    transition:.5s;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;
    z-index:3000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(450px,100%);
    background:white;
    border-radius:22px;
    padding:25px;
}

.modal-box h2{
    margin-bottom:20px;
}

.modal-box input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    margin-bottom:15px;
}

.modal-box input:focus{
    border-color:#888;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
    text-align:center;
    color:#999;
    padding:30px 10px;
}


/* =====================================================
   THEME MENU
===================================================== */

.theme-overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.55);

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;
    z-index:5000;
}

.theme-overlay.show{
    display:flex;
}

.theme-menu{
    width:min(430px,100%);
    background:white;
    color:#222;

    border-radius:24px;
    padding:24px;

    box-shadow:0 25px 80px rgba(0,0,0,.3);

    animation:themeOpen .18s ease;
}

@keyframes themeOpen{

    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.theme-menu-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.theme-menu-header h2{
    font-size:20px;
}

.close-theme{
    width:36px;
    height:36px;

    border:0;
    border-radius:50%;

    background:#eee;
    color:#222;

    cursor:pointer;
    font-size:20px;
}

.theme-options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.theme-option{
    border:2px solid transparent;
    background:#f5f5f5;

    padding:12px;
    border-radius:18px;

    cursor:pointer;
    text-align:right;

    transition:.15s;
}

.theme-option:hover{
    transform:translateY(-2px);
}

.theme-preview{
    width:100%;
    height:70px;

    border-radius:13px;

    margin-bottom:10px;

    display:flex;
    overflow:hidden;
}

.preview-main{
    flex:1;
}

.preview-side{
    width:35%;
}


/* WHITE / BLACK */

.preview-white-black .preview-main{
    background:#f7f1e8;
}

.preview-white-black .preview-side{
    background:#171717;
}


/* BLACK / WHITE */

.preview-black-white .preview-main{
    background:#101010;
}

.preview-black-white .preview-side{
    background:#fff;
}


/* PURPLE / PINK */

.preview-purple-pink .preview-main{
    background:#f6e9ff;
}

.preview-purple-pink .preview-side{
    background:#9b4dca;
}


/* BLUE */

.preview-blue .preview-main{
    background:#e7f6ff;
}

.preview-blue .preview-side{
    background:#174ea6;
}

.theme-option-title{
    font-weight:bold;
    font-size:14px;
}

.theme-option-desc{
    color:#888;
    font-size:11px;
    margin-top:5px;
}


/* =====================================================
   WHITE / BLACK THEME
===================================================== */

body.theme-white-black{
    background:#f7f1e8;
    color:#222;
}

body.theme-white-black .panel,
body.theme-white-black .stat-card,
body.theme-white-black .date-pill,
body.theme-white-black .modal-box{
    background:#fff;
    color:#222;
}

body.theme-white-black .task,
body.theme-white-black .habit,
body.theme-white-black .calendar .day{
    background:#fafafa;
}

body.theme-white-black .progress,
body.theme-white-black .habit-bar{
    background:#eee;
}

body.theme-white-black .progress-fill,
body.theme-white-black .habit-bar div{
    background:#171717;
}


/* =====================================================
   BLACK / WHITE THEME
===================================================== */

body.theme-black-white{
    background:#101010;
    color:#f5f5f5;
}

body.theme-black-white .panel,
body.theme-black-white .stat-card,
body.theme-black-white .date-pill,
body.theme-black-white .modal-box{
    background:#1b1b1b;
    color:#fff;
}

body.theme-black-white .task,
body.theme-black-white .habit,
body.theme-black-white .calendar .day{
    background:#242424;
    color:#fff;
}

body.theme-black-white .calendar .day-name{
    color:#aaa;
}

body.theme-black-white .progress,
body.theme-black-white .habit-bar{
    background:#333;
}

body.theme-black-white .progress-fill,
body.theme-black-white .habit-bar div{
    background:#fff;
}

body.theme-black-white .modal-box input{
    background:#222;
    color:white;
    border-color:#444;
}

body.theme-black-white .delete-task:hover{
    background:#333;
    color:#fff;
}


/* =====================================================
   PURPLE / PINK THEME
===================================================== */

body.theme-purple{
    background:#f7eaff;
    color:#2d1738;
}

body.theme-purple .sidebar{
    background:#5d237a;
}

body.theme-purple .logo span{
    color:#ff9fcf;
}

body.theme-purple .menu button:hover,
body.theme-purple .menu button.active{
    background:#77349a;
    color:white;
}

body.theme-purple .theme-btn{
    background:#77349a;
    border-color:#9b4dca;
}

body.theme-purple .panel,
body.theme-purple .stat-card,
body.theme-purple .date-pill,
body.theme-purple .modal-box{
    background:#fff7fd;
    color:#2d1738;
}

body.theme-purple .task,
body.theme-purple .habit,
body.theme-purple .calendar .day{
    background:#f9eefd;
}

body.theme-purple .primary-btn{
    background:#742f96;
}

body.theme-purple .primary-btn:hover{
    background:#8e3db5;
}

body.theme-purple .progress,
body.theme-purple .habit-bar{
    background:#ead3f2;
}

body.theme-purple .progress-fill,
body.theme-purple .habit-bar div{
    background:#c4479b;
}

body.theme-purple .calendar .today{
    background:#742f96;
    color:white;
}

body.theme-purple .calendar .selected{
    outline-color:#e477bd;
}

body.theme-purple .task input{
    accent-color:#c4479b;
}

body.theme-purple .stat-card h3{
    color:#8a6594;
}


/* =====================================================
   BLUE THEME
===================================================== */

body.theme-blue{
    background:#e9f7ff;
    color:#102a43;
}

body.theme-blue .sidebar{
    background:#123b75;
}

body.theme-blue .logo span{
    color:#72c8ff;
}

body.theme-blue .menu button:hover,
body.theme-blue .menu button.active{
    background:#20569a;
    color:white;
}

body.theme-blue .theme-btn{
    background:#20569a;
    border-color:#4388d1;
}

body.theme-blue .panel,
body.theme-blue .stat-card,
body.theme-blue .date-pill,
body.theme-blue .modal-box{
    background:#f7fcff;
    color:#102a43;
}

body.theme-blue .task,
body.theme-blue .habit,
body.theme-blue .calendar .day{
    background:#edf8ff;
}

body.theme-blue .primary-btn{
    background:#174ea6;
}

body.theme-blue .primary-btn:hover{
    background:#2265c4;
}

body.theme-blue .progress,
body.theme-blue .habit-bar{
    background:#ccecff;
}

body.theme-blue .progress-fill,
body.theme-blue .habit-bar div{
    background:#1976d2;
}

body.theme-blue .calendar .today{
    background:#174ea6;
    color:white;
}

body.theme-blue .calendar .selected{
    outline-color:#4da9e8;
}

body.theme-blue .task input{
    accent-color:#1976d2;
}

body.theme-blue .stat-card h3{
    color:#5c7891;
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1100px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard{
        grid-template-columns:1fr;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:750px){

    body{
        padding-bottom:78px;
    }

    .sidebar{
        top:auto;
        bottom:0;
        right:0;

        width:100%;
        height:72px;

        padding:6px 8px;

        flex-direction:row;
        align-items:center;
        justify-content:center;

        border-radius:18px 18px 0 0;
    }

    .logo{
        display:none;
    }

    .menu{
        width:100%;
        height:100%;

        display:grid;
        grid-template-columns:repeat(4,1fr);

        gap:5px;
    }

    .menu button{
        padding:5px 2px;
        border-radius:12px;

        text-align:center;
        font-size:11px;

        display:flex;
        flex-direction:column;

        align-items:center;
        justify-content:center;

        gap:3px;
    }

    .menu button span{
        margin:0;
        font-size:19px;
    }

    .theme-btn{
        position:absolute;

        bottom:82px;
        left:12px;

        width:44px;
        height:44px;

        padding:0;
        border-radius:50%;

        font-size:18px;
    }

    .main{
        margin-right:0;
        width:100%;

        padding:16px;
        padding-bottom:25px;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;

        gap:12px;
        margin-bottom:18px;
    }

    .topbar h1{
        font-size:22px;
    }

    .date-pill{
        width:100%;
        text-align:center;
        padding:10px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
        margin-bottom:15px;
    }

    .stat-card{
        padding:15px;
        border-radius:16px;
    }

    .stat-card h3{
        font-size:12px;
        margin-bottom:8px;
    }

    .stat-card strong{
        font-size:24px;
    }

    .dashboard{
        gap:14px;
    }

    .panel{
        padding:15px;
        border-radius:18px;
    }

    .panel-title{
        margin-bottom:15px;
    }

    .panel-title h2{
        font-size:16px;
    }

    .primary-btn{
        padding:9px 12px;
        font-size:12px;
    }

    .task{
        padding:12px;
        border-radius:12px;
    }

    .calendar{
        gap:4px;
    }

    .calendar div{
        min-height:34px;
        font-size:11px;
    }

    .habit{
        padding:12px;
    }

    .theme-menu{
        padding:18px;
        border-radius:20px;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

    .main{
        padding:12px;
    }

    .stats{
        gap:8px;
    }

    .stat-card{
        padding:12px;
    }

    .stat-card strong{
        font-size:21px;
    }

    .topbar h1{
        font-size:20px;
    }

    .panel{
        padding:12px;
    }

    .calendar div{
        min-height:30px;
        font-size:10px;
    }

    .menu button{
        font-size:9px;
    }

    .menu button span{
        font-size:17px;
    }

    .theme-options{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .theme-preview{
        height:55px;
    }

    .theme-option-title{
        font-size:12px;
    }

}


/* =====================================================
   EXTRA SMALL
===================================================== */

@media(max-width:320px){

    .theme-options{
        grid-template-columns:1fr;
    }

}


/* =====================================================
   ACCESSIBILITY
===================================================== */

button:focus-visible,
input:focus-visible{
    outline:2px solid #4da9e8;
    outline-offset:2px;
}

</style>
</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="logo">
        Dream <span>Planner</span>
    </div>

    <nav class="menu">

        <button
            class="active"
            onclick="showSection('dashboard')"
        >
            <span>⌂</span>
            داشبورد
        </button>

        <button
            onclick="showSection('tasks')"
        >
            <span>✓</span>
            کارها
        </button>

        <button
            onclick="showSection('calendar')"
        >
            <span>□</span>
            تقویم
        </button>

        <button
            onclick="showSection('habits')"
        >
            <span>↗</span>
            عادت‌ها
        </button>

    </nav>


    <button
        class="theme-btn"
        onclick="openThemeMenu()"
        title="تغییر تم"
    >
        ◐
    </button>

</aside>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

    <header class="topbar">

        <div>
            <h1>برنامه امروز من</h1>
        </div>

        <div
            class="date-pill"
            id="currentDate"
        >
            ---
        </div>

    </header>



    <!-- =================================================
         STATS
    ================================================== -->

    <section class="stats">

        <div class="stat-card">

            <h3>
                کل کارها
            </h3>

            <strong id="totalTasks">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                انجام شده
            </h3>

            <strong id="completedTasks">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                درصد پیشرفت
            </h3>

            <strong id="completionPercent">
                0%
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                روزهای فعال
            </h3>

            <strong id="activeDays">
                0
            </strong>

        </div>

    </section>



    <!-- =================================================
         DASHBOARD
    ================================================== -->

    <section class="dashboard">


        <!-- TASK PANEL -->

        <div
            class="panel"
            id="tasksPanel"
        >

            <div class="panel-title">

                <h2>
                    کارهای امروز
                </h2>

                <button
                    class="primary-btn"
                    onclick="openModal()"
                >
                    + افزودن کار
                </button>

            </div>


            <div
                class="task-list"
                id="taskList"
            >

                <div class="empty">
                    هنوز کاری اضافه نکرده‌ای
                </div>

            </div>

        </div>



        <!-- PROGRESS PANEL -->

        <div class="panel">

            <div class="panel-title">

                <h2>
                    پیشرفت ماهانه
                </h2>

            </div>


            <div class="progress-box">

                <div class="progress-header">

                    <span>
                        پیشرفت کلی
                    </span>

                    <strong id="monthlyPercent">
                        0%
                    </strong>

                </div>


                <div class="progress">

                    <div
                        class="progress-fill"
                        id="monthlyProgress"
                    ></div>

                </div>

            </div>


            <div class="progress-box">

                <div class="progress-header">

                    <span>
                        کارهای انجام‌شده
                    </span>

                    <strong id="monthlyCompleted">
                        0
                    </strong>

                </div>

            </div>

        </div>



        <!-- CALENDAR -->

        <div
            class="panel"
            id="calendarPanel"
        >

            <div class="panel-title">

                <h2>
                    تقویم
                </h2>

            </div>


            <div
                class="calendar"
                id="calendar"
            ></div>

        </div>



        <!-- HABITS -->

        <div
            class="panel"
            id="habitsPanel"
        >

            <div class="panel-title">

                <h2>
                    عادت‌های من
                </h2>

            </div>


            <div
                class="habits"
                id="habits"
            >


                <div class="habit">

                    <div class="habit-top">

                        <span>
                            برنامه‌ریزی روزانه
                        </span>

                        <strong id="habit1Percent">
                            0%
                        </strong>

                    </div>


                    <div class="habit-bar">

                        <div
                            id="habit1Bar"
                        ></div>

                    </div>

                </div>



                <div class="habit">

                    <div class="habit-top">

                        <span>
                            انجام کارهای مهم
                        </span>

                        <strong id="habit2Percent">
                            0%
                        </strong>

                    </div>


                    <div class="habit-bar">

                        <div
                            id="habit2Bar"
                        ></div>

                    </div>

                </div>


            </div>

        </div>


    </section>

</main>



<!-- =====================================================
     ADD TASK MODAL
===================================================== -->

<div
    class="modal"
    id="taskModal"
>

    <div class="modal-box">

        <h2>
            افزودن کار جدید
        </h2>


        <input
            type="text"
            id="taskInput"
            placeholder="مثلاً: مطالعه ۳۰ دقیقه"
            autocomplete="off"
        >


        <div class="modal-actions">

            <button
                class="primary-btn"
                onclick="addTask()"
            >
                افزودن
            </button>


            <button
                class="primary-btn"
                style="background:#eee;color:#222"
                onclick="closeModal()"
            >
                لغو
            </button>

        </div>

    </div>

</div>



<!-- =====================================================
     THEME MENU
===================================================== -->

<div
    class="theme-overlay"
    id="themeMenuOverlay"
    onclick="closeThemeOutside(event)"
>

    <div
        class="theme-menu"
        onclick="event.stopPropagation()"
    >

        <div class="theme-menu-header">

            <h2>
                انتخاب تم
            </h2>

            <button
                class="close-theme"
                onclick="closeThemeMenu()"
            >
                ×
            </button>

        </div>


        <div class="theme-options">


            <!-- WHITE BLACK -->

            <button
                class="theme-option"
                onclick="setTheme('white')"
            >

                <div
                    class="theme-preview preview-white-black"
                >
                    <div class="preview-main"></div>
                    <div class="preview-side"></div>
                </div>

                <div class="theme-option-title">
                    سفید ـ مشکی
                </div>

                <div class="theme-option-desc">
                    تم روشن اصلی
                </div>

            </button>



            <!-- BLACK WHITE -->

            <button
                class="theme-option"
                onclick="setTheme('black')"
            >

                <div
                    class="theme-preview preview-black-white"
                >
                    <div class="preview-main"></div>
                    <div class="preview-side"></div>
                </div>

                <div class="theme-option-title">
                    مشکی ـ سفید
                </div>

                <div class="theme-option-desc">
                    حالت تاریک
                </div>

            </button>



            <!-- PURPLE PINK -->

            <button
                class="theme-option"
                onclick="setTheme('purple')"
            >

                <div
                    class="theme-preview preview-purple-pink"
                >
                    <div class="preview-main"></div>
                    <div class="preview-side"></div>
                </div>

                <div class="theme-option-title">
                    بنفش ـ صورتی
                </div>

                <div class="theme-option-desc">
                    تم فانتزی
                </div>

            </button>



            <!-- BLUE -->

            <button
                class="theme-option"
                onclick="setTheme('blue')"
            >

                <div
                    class="theme-preview preview-blue"
                >
                    <div class="preview-main"></div>
                    <div class="preview-side"></div>
                </div>

                <div class="theme-option-title">
                    آبی آسمانی ـ آبی پررنگ
                </div>

                <div class="theme-option-desc">
                    تم آبی
                </div>

            </button>


        </div>

    </div>

</div>



<script>

/* =====================================================
   DATA
===================================================== */

let tasks = JSON.parse(
    localStorage.getItem("dreamPlannerTasks") || "[]"
);

let activeDays = Number(
    localStorage.getItem("dreamPlannerActiveDays") || 0
);


/* =====================================================
   DATE
===================================================== */

function updateDate(){

    const now = new Date();

    const options = {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
    };

    document.getElementById("currentDate").textContent =
        now.toLocaleDateString("fa-IR",options);
}


/* =====================================================
   SAVE
===================================================== */

function saveData(){

    localStorage.setItem(
        "dreamPlannerTasks",
        JSON.stringify(tasks)
    );

    localStorage.setItem(
        "dreamPlannerActiveDays",
        activeDays
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =====================================================
   RENDER TASKS
===================================================== */

function renderTasks(){

    const list =
        document.getElementById("taskList");


    if(tasks.length === 0){

        list.innerHTML = `
            <div class="empty">
                هنوز کاری اضافه نکرده‌ای
            </div>
        `;

        updateStats();

        return;
    }


    list.innerHTML = "";


    tasks.forEach((task,index)=>{

        const item =
            document.createElement("div");


        item.className =
            "task " +
            (task.done ? "done" : "");


        item.innerHTML = `

            <input
                type="checkbox"
                ${task.done ? "checked" : ""}
                onchange="toggleTask(${index})"
            >

            <div class="task-text">
                ${escapeHTML(task.text)}
            </div>

            <button
                class="delete-task"
                onclick="deleteTask(${index})"
                aria-label="حذف کار"
            >
                ×
            </button>

        `;


        list.appendChild(item);

    });


    updateStats();

}


/* =====================================================
   ADD TASK
===================================================== */

function addTask(){

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();


    if(!text){

        input.focus();

        return;
    }


    tasks.push({

        text:text,

        done:false,

        date:new Date().toISOString()

    });


    input.value = "";


    saveData();

    renderTasks();

    closeModal();

}


/* =====================================================
   TOGGLE TASK
===================================================== */

function toggleTask(index){

    tasks[index].done =
        !tasks[index].done;


    saveData();

    renderTasks();

}


/* =====================================================
   DELETE TASK
===================================================== */

function deleteTask(index){

    tasks.splice(index,1);

    saveData();

    renderTasks();

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    const total =
        tasks.length;


    const completed =
        tasks.filter(
            t => t.done
        ).length;


    const percent =
        total === 0
        ? 0
        : Math.round(
            (completed / total) * 100
        );


    document.getElementById(
        "totalTasks"
    ).textContent = total;


    document.getElementById(
        "completedTasks"
    ).textContent = completed;


    document.getElementById(
        "completionPercent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "monthlyPercent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "monthlyProgress"
    ).style.width =
        percent + "%";


    document.getElementById(
        "monthlyCompleted"
    ).textContent =
        completed;


    document.getElementById(
        "activeDays"
    ).textContent =
        activeDays;


    document.getElementById(
        "habit1Percent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "habit1Bar"
    ).style.width =
        percent + "%";


    document.getElementById(
        "habit2Percent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "habit2Bar"
    ).style.width =
        percent + "%";

}


/* =====================================================
   MODAL
===================================================== */

function openModal(){

    document
        .getElementById("taskModal")
        .classList.add("show");


    setTimeout(()=>{

        document
            .getElementById("taskInput")
            .focus();

    },100);

}


function closeModal(){

    document
        .getElementById("taskModal")
        .classList.remove("show");

}


/* =====================================================
   MODAL CLICK OUTSIDE
===================================================== */

document
    .getElementById("taskModal")
    .addEventListener(
        "click",
        function(e){

            if(e.target === this){

                closeModal();

            }

        }
    );


/* =====================================================
   ENTER / ESCAPE
===================================================== */

document
    .getElementById("taskInput")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){

                addTask();

            }


            if(e.key === "Escape"){

                closeModal();

            }

        }
    );


/* =====================================================
   CALENDAR
===================================================== */

function generateCalendar(){

    const calendar =
        document.getElementById("calendar");


    calendar.innerHTML = "";


    const names = [

        "ش",
        "ی",
        "د",
        "س",
        "چ",
        "پ",
        "ج"

    ];


    names.forEach(name=>{

        const div =
            document.createElement("div");


        div.className =
            "day-name";


        div.textContent =
            name;


        calendar.appendChild(div);

    });


    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        now.getMonth();


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for(
        let i = 0;
        i < firstDay;
        i++
    ){

        const empty =
            document.createElement("div");

        calendar.appendChild(empty);

    }


    for(
        let day = 1;
        day <= days;
        day++
    ){

        const div =
            document.createElement("div");


        div.className =
            "day";


        div.textContent =
            day;


        if(
            day === now.getDate()
        ){

            div.classList.add("today");

        }


        div.onclick = ()=>{

            document
                .querySelectorAll(
                    ".calendar .selected"
                )
                .forEach(
                    x =>
                    x.classList.remove(
                        "selected"
                    )
                );


            div.classList.add(
                "selected"
            );

        };


        calendar.appendChild(div);

    }

}


/* =====================================================
   NAVIGATION
===================================================== */

function showSection(section){

    document
        .querySelectorAll(".menu button")
        .forEach(
            btn =>
            btn.classList.remove("active")
        );


    if(section === "dashboard"){

        window.scrollTo({

            top:0,

            behavior:"smooth"

        });


        document
            .querySelector(
                ".menu button:nth-child(1)"
            )
            .classList.add("active");

    }


    if(section === "tasks"){

        document
            .getElementById("tasksPanel")
            .scrollIntoView({

                behavior:"smooth",

                block:"start"

            });


        document
            .querySelector(
                ".menu button:nth-child(2)"
            )
            .classList.add("active");

    }


    if(section === "calendar"){

        document
            .getElementById("calendarPanel")
            .scrollIntoView({

                behavior:"smooth",

                block:"start"

            });


        document
            .querySelector(
                ".menu button:nth-child(3)"
            )
            .classList.add("active");

    }


    if(section === "habits"){

        document
            .getElementById("habitsPanel")
            .scrollIntoView({

                behavior:"smooth",

                block:"start"

            });


        document
            .querySelector(
                ".menu button:nth-child(4)"
            )
            .classList.add("active");

    }

}


/* =====================================================
   THEME MENU
===================================================== */

function openThemeMenu(){

    document
        .getElementById(
            "themeMenuOverlay"
        )
        .classList.add("show");

}


function closeThemeMenu(){

    document
        .getElementById(
            "themeMenuOverlay"
        )
        .classList.remove("show");

}


function closeThemeOutside(event){

    if(
        event.target ===
        document.getElementById(
            "themeMenuOverlay"
        )
    ){

        closeThemeMenu();

    }

}


/* =====================================================
   SET THEME
===================================================== */

function setTheme(theme){

    const body =
        document.body;


    body.classList.remove(

        "theme-white-black",

        "theme-black-white",

        "theme-purple",

        "theme-blue"

    );


    if(theme === "white"){

        body.classList.add(
            "theme-white-black"
        );

    }


    if(theme === "black"){

        body.classList.add(
            "theme-black-white"
        );

    }


    if(theme === "purple"){

        body.classList.add(
            "theme-purple"
        );

    }


    if(theme === "blue"){

        body.classList.add(
            "theme-blue"
        );

    }


    localStorage.setItem(
        "dreamPlannerTheme",
        theme
    );


    closeThemeMenu();

}


/* =====================================================
   LOAD THEME
===================================================== */

function loadTheme(){

    const savedTheme =
        localStorage.getItem(
            "dreamPlannerTheme"
        ) || "white";


    setThemeWithoutClosing(
        savedTheme
    );

}


function setThemeWithoutClosing(theme){

    const body =
        document.body;


    body.classList.remove(

        "theme-white-black",

        "theme-black-white",

        "theme-purple",

        "theme-blue"

    );


    if(theme === "white"){

        body.classList.add(
            "theme-white-black"
        );

    }


    else if(theme === "black"){

        body.classList.add(
            "theme-black-white"
        );

    }


    else if(theme === "purple"){

        body.classList.add(
            "theme-purple"
        );

    }


    else if(theme === "blue"){

        body.classList.add(
            "theme-blue"
        );

    }

}


/* =====================================================
   ESCAPE CLOSE THEME
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            closeThemeMenu();

        }

    }
);


/* =====================================================
   START
===================================================== */

updateDate();

renderTasks();

generateCalendar();

loadTheme();

</script>

</body>
</html>
