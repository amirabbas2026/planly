<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Planner</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f7f1e8;
    color:#222;
    transition:
        background .8s ease,
        color .8s ease;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    position:fixed;
    right:0;
    top:0;

    width:250px;
    height:100vh;

    background:#171717;
    color:white;

    padding:25px 18px;

    z-index:1000;

    display:flex;
    flex-direction:column;
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:40px;
}

.logo span{
    color:#d8b98b;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.menu button{
    border:0;
    background:transparent;
    color:#aaa;

    padding:14px;
    border-radius:14px;

    cursor:pointer;
    font-size:14px;
    text-align:right;

    transition:
        background .25s ease,
        color .25s ease,
        transform .25s ease;
}

.menu button:hover{
    transform:translateX(-3px);
}

.menu button:hover,
.menu button.active{
    background:#292929;
    color:#fff;
}

.menu button span{
    margin-left:10px;
}

.theme-btn{
    margin-top:auto;

    width:100%;

    border:1px solid #444;
    background:#222;
    color:white;

    padding:12px;

    border-radius:12px;

    cursor:pointer;

    transition:
        transform .25s ease,
        background .25s ease;
}

.theme-btn:hover{
    transform:translateY(-2px);
    background:#2d2d2d;
}


/* =========================================================
   MAIN
   ========================================================= */

.main{
    margin-right:250px;

    width:calc(100% - 250px);
    min-height:100vh;

    padding:25px;
}


/* =========================================================
   TOPBAR
   ========================================================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:20px;
    margin-bottom:25px;
}

.topbar h1{
    font-size:28px;
}

.date-pill{
    background:white;

    padding:10px 18px;

    border-radius:20px;

    box-shadow:0 5px 20px rgba(0,0,0,.05);

    white-space:nowrap;

    transition:
        background .7s ease,
        color .7s ease;
}


/* =========================================================
   STATS
   ========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:18px;

    margin-bottom:25px;
}

.stat-card{
    background:white;

    border-radius:20px;

    padding:22px;

    min-width:0;

    box-shadow:0 5px 25px rgba(0,0,0,.05);

    transition:
        background .7s ease,
        color .7s ease,
        transform .25s ease;
}

.stat-card:hover{
    transform:translateY(-3px);
}

.stat-card h3{
    font-size:14px;
    color:#777;

    margin-bottom:12px;
}

.stat-card strong{
    font-size:30px;
}


/* =========================================================
   DASHBOARD
   ========================================================= */

.dashboard{
    display:grid;

    grid-template-columns:1.5fr 1fr;

    gap:20px;
}

.panel{
    background:white;

    border-radius:22px;

    padding:22px;

    box-shadow:0 5px 25px rgba(0,0,0,.05);

    min-width:0;

    transition:
        background .7s ease,
        color .7s ease;
}

.panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    margin-bottom:20px;
}

.panel-title h2{
    font-size:19px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.primary-btn{
    border:0;

    background:#171717;
    color:white;

    padding:11px 17px;

    border-radius:12px;

    cursor:pointer;

    transition:
        transform .2s ease,
        background .2s ease;
}

.primary-btn:hover{
    transform:translateY(-2px);
    background:#333;
}


/* =========================================================
   TASKS
   ========================================================= */

.task-list{
    display:flex;
    flex-direction:column;

    gap:10px;
}

.task{
    display:flex;
    align-items:center;

    gap:12px;

    padding:14px;

    background:#fafafa;

    border-radius:14px;

    transition:
        background .5s ease,
        transform .2s ease;
}

.task:hover{
    transform:translateX(-2px);
}

.task input{
    width:19px;
    height:19px;

    cursor:pointer;
}

.task-text{
    flex:1;
    min-width:0;

    overflow-wrap:anywhere;
}

.task.done .task-text{
    text-decoration:line-through;
    opacity:.45;
}


/* =========================================================
   PROGRESS
   ========================================================= */

.progress-box{
    margin-bottom:22px;
}

.progress-header{
    display:flex;
    justify-content:space-between;

    margin-bottom:9px;
}

.progress{
    width:100%;
    height:10px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;
}

.progress-fill{
    height:100%;

    width:0;

    background:#171717;

    border-radius:20px;

    transition:
        width .7s ease,
        background .7s ease;
}


/* =========================================================
   CALENDAR
   ========================================================= */

.calendar{
    display:grid;

    grid-template-columns:repeat(7,1fr);

    gap:7px;
}

.calendar div{
    min-height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    font-size:12px;
}

.calendar .day-name{
    font-weight:bold;
    color:#888;
}

.calendar .day{
    background:#f7f7f7;

    cursor:pointer;

    transition:
        background .3s ease,
        transform .2s ease;
}

.calendar .day:hover{
    transform:scale(1.05);
}

.calendar .today{
    background:#171717;
    color:white;
}

.calendar .selected{
    outline:2px solid #d8b98b;
}


/* =========================================================
   HABITS
   ========================================================= */

.habits{
    display:flex;
    flex-direction:column;

    gap:12px;
}

.habit{
    background:#fafafa;

    padding:14px;

    border-radius:14px;

    transition:
        background .5s ease;
}

.habit-top{
    display:flex;
    justify-content:space-between;

    gap:10px;

    margin-bottom:9px;
}

.habit-bar{
    height:7px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;
}

.habit-bar div{
    height:100%;

    width:0;

    background:#171717;

    transition:
        width .7s ease,
        background .7s ease;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.5);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:3000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(450px,100%);

    background:white;

    border-radius:22px;

    padding:25px;

    transition:
        background .7s ease,
        color .7s ease;
}

.modal-box h2{
    margin-bottom:20px;
}

.modal-box input{
    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:12px;

    outline:none;

    font-size:15px;

    margin-bottom:15px;

    transition:
        background .5s ease,
        color .5s ease,
        border-color .5s ease;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
}


/* =========================================================
   EMPTY
   ========================================================= */

.empty{
    text-align:center;

    color:#999;

    padding:30px 10px;
}


/* =========================================================
   FANTASY THEME TRANSITION
   ========================================================= */

/*
   این لایه عمداً چندین تکه رنگی دارد.
   هر تکه مسیر متفاوتی دارد تا انتقال تم
   شبیه پخش شدن رنگ روی صفحه باشد.
*/

.theme-transition{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:99999;

    opacity:0;

    visibility:hidden;

    overflow:hidden;

    background:#101010;

    transition:
        opacity .3s ease,
        visibility .3s ease;
}


/* فعال شدن لایه */

.theme-transition.active{
    opacity:1;
    visibility:visible;
}


/* =========================================================
   PAINT BLOBS
   ========================================================= */

.paint{
    position:absolute;

    display:block;

    pointer-events:none;

    border-radius:50%;

    filter:blur(45px);

    opacity:0;

    transform-origin:center;

    will-change:
        transform,
        opacity;
}


/* رنگ اول */

.paint1{
    width:75vw;
    height:75vw;

    left:-35vw;
    top:-20vh;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0%,
            rgba(255,255,255,.72) 18%,
            rgba(255,255,255,.32) 40%,
            transparent 72%
        );
}


/* رنگ دوم */

.paint2{
    width:85vw;
    height:70vw;

    right:-40vw;
    top:5vh;

    background:
        radial-gradient(
            circle,
            rgba(216,185,139,.72) 0%,
            rgba(216,185,139,.4) 22%,
            rgba(216,185,139,.12) 45%,
            transparent 72%
        );
}


/* رنگ سوم */

.paint3{
    width:65vw;
    height:80vw;

    left:15vw;
    bottom:-45vw;

    background:
        radial-gradient(
            circle,
            rgba(255,244,222,.82) 0%,
            rgba(255,244,222,.35) 30%,
            transparent 70%
        );
}


/* رنگ چهارم */

.paint4{
    width:80vw;
    height:60vw;

    right:10vw;
    top:-35vw;

    background:
        radial-gradient(
            circle,
            rgba(180,155,120,.5) 0%,
            rgba(180,155,120,.22) 35%,
            transparent 72%
        );
}


/* رنگ پنجم */

.paint5{
    width:60vw;
    height:70vw;

    left:-20vw;
    bottom:-30vw;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.5) 0%,
            rgba(255,255,255,.18) 35%,
            transparent 72%
        );
}


/* =========================================================
   DARK THEME PAINT
   ========================================================= */

.theme-transition.dark-paint{
    background:
        radial-gradient(
            ellipse at 50% 50%,
            #24211e 0%,
            #151515 55%,
            #101010 100%
        );
}


/* =========================================================
   LIGHT THEME PAINT
   ========================================================= */

.theme-transition.light-paint{
    background:
        radial-gradient(
            ellipse at 50% 50%,
            #fffaf2 0%,
            #f7f1e8 55%,
            #e6d8c4 100%
        );
}


/* =========================================================
   PAINT ANIMATION
   ========================================================= */

.theme-transition.active .paint1{
    animation:
        paintMove1 2.8s cubic-bezier(.35,.05,.2,1) forwards;
}

.theme-transition.active .paint2{
    animation:
        paintMove2 3.1s cubic-bezier(.25,.1,.25,1) forwards;
}

.theme-transition.active .paint3{
    animation:
        paintMove3 2.9s cubic-bezier(.4,.05,.2,1) forwards;
}

.theme-transition.active .paint4{
    animation:
        paintMove4 3.2s cubic-bezier(.25,.1,.2,1) forwards;
}

.theme-transition.active .paint5{
    animation:
        paintMove5 2.7s cubic-bezier(.35,.05,.25,1) forwards;
}


/* =========================================================
   RANDOM PATH 1
   ========================================================= */

@keyframes paintMove1{

    0%{
        transform:
            translate(-45vw,35vh)
            rotate(-25deg)
            scale(.25);

        opacity:0;
    }

    12%{
        transform:
            translate(-25vw,8vh)
            rotate(10deg)
            scale(.65);

        opacity:.55;
    }

    27%{
        transform:
            translate(0vw,-12vh)
            rotate(-18deg)
            scale(1.05);

        opacity:.8;
    }

    43%{
        transform:
            translate(25vw,20vh)
            rotate(28deg)
            scale(1.35);

        opacity:.72;
    }

    61%{
        transform:
            translate(5vw,42vh)
            rotate(-20deg)
            scale(1.05);

        opacity:.8;
    }

    78%{
        transform:
            translate(55vw,5vh)
            rotate(35deg)
            scale(1.5);

        opacity:.68;
    }

    100%{
        transform:
            translate(110vw,-15vh)
            rotate(-15deg)
            scale(1.7);

        opacity:.9;
    }
}


/* =========================================================
   RANDOM PATH 2
   ========================================================= */

@keyframes paintMove2{

    0%{
        transform:
            translate(50vw,-30vh)
            rotate(20deg)
            scale(.35);

        opacity:0;
    }

    16%{
        transform:
            translate(25vw,5vh)
            rotate(-15deg)
            scale(.8);

        opacity:.45;
    }

    34%{
        transform:
            translate(-5vw,25vh)
            rotate(25deg)
            scale(1.15);

        opacity:.7;
    }

    50%{
        transform:
            translate(-25vw,-5vh)
            rotate(-30deg)
            scale(1.4);

        opacity:.8;
    }

    69%{
        transform:
            translate(10vw,35vh)
            rotate(18deg)
            scale(1.2);

        opacity:.62;
    }

    84%{
        transform:
            translate(-50vw,10vh)
            rotate(-25deg)
            scale(1.55);

        opacity:.7;
    }

    100%{
        transform:
            translate(-110vw,25vh)
            rotate(20deg)
            scale(1.8);

        opacity:.8;
    }
}


/* =========================================================
   RANDOM PATH 3
   ========================================================= */

@keyframes paintMove3{

    0%{
        transform:
            translate(-15vw,60vh)
            rotate(10deg)
            scale(.3);

        opacity:0;
    }

    20%{
        transform:
            translate(20vw,25vh)
            rotate(-20deg)
            scale(.9);

        opacity:.55;
    }

    39%{
        transform:
            translate(45vw,0)
            rotate(30deg)
            scale(1.25);

        opacity:.7;
    }

    57%{
        transform:
            translate(15vw,-20vh)
            rotate(-15deg)
            scale(1.5);

        opacity:.65;
    }

    76%{
        transform:
            translate(-20vw,15vh)
            rotate(25deg)
            scale(1.25);

        opacity:.6;
    }

    100%{
        transform:
            translate(-90vw,-15vh)
            rotate(-20deg)
            scale(1.7);

        opacity:.8;
    }
}


/* =========================================================
   RANDOM PATH 4
   ========================================================= */

@keyframes paintMove4{

    0%{
        transform:
            translate(40vw,-45vh)
            rotate(-20deg)
            scale(.3);

        opacity:0;
    }

    18%{
        transform:
            translate(5vw,-5vh)
            rotate(20deg)
            scale(.8);

        opacity:.4;
    }

    37%{
        transform:
            translate(-35vw,15vh)
            rotate(-25deg)
            scale(1.2);

        opacity:.65;
    }

    54%{
        transform:
            translate(-5vw,40vh)
            rotate(30deg)
            scale(1.4);

        opacity:.72;
    }

    73%{
        transform:
            translate(40vw,15vh)
            rotate(-20deg)
            scale(1.25);

        opacity:.6;
    }

    100%{
        transform:
            translate(105vw,30vh)
            rotate(25deg)
            scale(1.7);

        opacity:.8;
    }
}


/* =========================================================
   RANDOM PATH 5
   ========================================================= */

@keyframes paintMove5{

    0%{
        transform:
            translate(-55vw,-10vh)
            rotate(30deg)
            scale(.25);

        opacity:0;
    }

    20%{
        transform:
            translate(-20vw,25vh)
            rotate(-25deg)
            scale(.8);

        opacity:.45;
    }

    40%{
        transform:
            translate(20vw,5vh)
            rotate(15deg)
            scale(1.15);

        opacity:.7;
    }

    58%{
        transform:
            translate(50vw,35vh)
            rotate(-30deg)
            scale(1.4);

        opacity:.65;
    }

    77%{
        transform:
            translate(20vw,-10vh)
            rotate(20deg)
            scale(1.3);

        opacity:.7;
    }

    100%{
        transform:
            translate(110vw,5vh)
            rotate(-15deg)
            scale(1.8);

        opacity:.75;
    }
}


/* =========================================================
   DARK MODE
   ========================================================= */

body.dark{
    background:#101010;
    color:#f5f5f5;
}

body.dark .panel,
body.dark .stat-card,
body.dark .date-pill,
body.dark .modal-box{
    background:#1b1b1b;
    color:#fff;
}

body.dark .task,
body.dark .habit,
body.dark .calendar .day{
    background:#242424;
}

body.dark .calendar .day-name{
    color:#aaa;
}

body.dark .progress,
body.dark .habit-bar{
    background:#333;
}

body.dark .progress-fill,
body.dark .habit-bar div{
    background:#fff;
}

body.dark .modal-box input{
    background:#222;
    color:white;
    border-color:#444;
}

body.dark .primary-btn{
    background:#f5f5f5;
    color:#111;
}

body.dark .primary-btn:hover{
    background:#fff;
}

body.dark .theme-btn{
    background:#f5f5f5;
    color:#111;
}


/* =========================================================
   TABLET
   ========================================================= */

@media(max-width:1100px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard{
        grid-template-columns:1fr;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:750px){

    body{
        padding-bottom:78px;
    }

    .sidebar{
        top:auto;
        bottom:0;
        right:0;

        width:100%;
        height:72px;

        padding:6px 8px;

        flex-direction:row;

        align-items:center;
        justify-content:center;

        border-radius:18px 18px 0 0;
    }

    .logo{
        display:none;
    }

    .menu{
        width:100%;
        height:100%;

        display:grid;

        grid-template-columns:repeat(4,1fr);

        gap:5px;
    }

    .menu button{
        padding:5px 2px;

        border-radius:12px;

        text-align:center;

        font-size:11px;

        display:flex;

        flex-direction:column;

        align-items:center;
        justify-content:center;

        gap:3px;
    }

    .menu button span{
        margin:0;
        font-size:19px;
    }

    .theme-btn{
        position:absolute;

        bottom:82px;
        left:12px;

        width:44px;
        height:44px;

        padding:0;

        border-radius:50%;

        font-size:18px;
    }

    .main{
        margin-right:0;

        width:100%;

        padding:16px;
        padding-bottom:25px;
    }

    .topbar{
        align-items:flex-start;

        flex-direction:column;

        gap:12px;

        margin-bottom:18px;
    }

    .topbar h1{
        font-size:22px;
    }

    .date-pill{
        width:100%;

        text-align:center;

        padding:10px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);

        gap:10px;

        margin-bottom:15px;
    }

    .stat-card{
        padding:15px;

        border-radius:16px;
    }

    .stat-card h3{
        font-size:12px;

        margin-bottom:8px;
    }

    .stat-card strong{
        font-size:24px;
    }

    .dashboard{
        gap:14px;
    }

    .panel{
        padding:15px;

        border-radius:18px;
    }

    .panel-title{
        margin-bottom:15px;
    }

    .panel-title h2{
        font-size:16px;
    }

    .primary-btn{
        padding:9px 12px;

        font-size:12px;
    }

    .task{
        padding:12px;

        border-radius:12px;
    }

    .calendar{
        gap:4px;
    }

    .calendar div{
        min-height:34px;

        font-size:11px;
    }

    .habit{
        padding:12px;
    }

    /*
       روی موبایل blur کمتر می‌شود
       تا انیمیشن روان‌تر باشد.
    */

    .paint{
        filter:blur(30px);
    }
}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media(max-width:380px){

    .main{
        padding:12px;
    }

    .stats{
        gap:8px;
    }

    .stat-card{
        padding:12px;
    }

    .stat-card strong{
        font-size:21px;
    }

    .topbar h1{
        font-size:20px;
    }

    .panel{
        padding:12px;
    }

    .calendar div{
        min-height:30px;

        font-size:10px;
    }

    .menu button{
        font-size:9px;
    }

    .menu button span{
        font-size:17px;
    }
}


/* =========================================================
   REDUCE MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        scroll-behavior:auto !important;
    }

    .theme-transition .paint{
        animation-duration:.8s !important;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     FANTASY THEME TRANSITION
     ======================================================= -->

<div
    class="theme-transition"
    id="themeTransition"
>

    <span class="paint paint1"></span>
    <span class="paint paint2"></span>
    <span class="paint paint3"></span>
    <span class="paint paint4"></span>
    <span class="paint paint5"></span>

</div>


<!-- =======================================================
     SIDEBAR
     ======================================================= -->

<aside class="sidebar">

    <div class="logo">
        Dream <span>Planner</span>
    </div>

    <nav class="menu">

        <button
            class="active"
            onclick="showSection('dashboard')"
        >
            <span>⌂</span>
            داشبورد
        </button>

        <button
            onclick="showSection('tasks')"
        >
            <span>✓</span>
            کارها
        </button>

        <button
            onclick="showSection('calendar')"
        >
            <span>□</span>
            تقویم
        </button>

        <button
            onclick="showSection('habits')"
        >
            <span>↗</span>
            عادت‌ها
        </button>

    </nav>


    <button
        class="theme-btn"
        onclick="toggleTheme()"
        aria-label="تغییر تم"
    >
        ◐
    </button>

</aside>



<!-- =======================================================
     MAIN
     ======================================================= -->

<main class="main">

    <header class="topbar">

        <div>

            <h1>
                برنامه امروز من
            </h1>

        </div>


        <div
            class="date-pill"
            id="currentDate"
        >
            ---
        </div>

    </header>



    <!-- ===================================================
         STATS
         =================================================== -->

    <section class="stats">

        <div class="stat-card">

            <h3>
                کل کارها
            </h3>

            <strong id="totalTasks">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                انجام شده
            </h3>

            <strong id="completedTasks">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                درصد پیشرفت
            </h3>

            <strong id="completionPercent">
                0%
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                روزهای فعال
            </h3>

            <strong id="activeDays">
                0
            </strong>

        </div>

    </section>



    <!-- ===================================================
         DASHBOARD
         =================================================== -->

    <section class="dashboard">


        <!-- TASK PANEL -->

        <div
            class="panel"
            id="tasksPanel"
        >

            <div class="panel-title">

                <h2>
                    کارهای امروز
                </h2>

                <button
                    class="primary-btn"
                    onclick="openModal()"
                >
                    + افزودن کار
                </button>

            </div>


            <div
                class="task-list"
                id="taskList"
            >

                <div class="empty">
                    هنوز کاری اضافه نکرده‌ای
                </div>

            </div>

        </div>



        <!-- PROGRESS PANEL -->

        <div class="panel">

            <div class="panel-title">

                <h2>
                    پیشرفت ماهانه
                </h2>

            </div>


            <div class="progress-box">

                <div class="progress-header">

                    <span>
                        پیشرفت کلی
                    </span>

                    <strong id="monthlyPercent">
                        0%
                    </strong>

                </div>


                <div class="progress">

                    <div
                        class="progress-fill"
                        id="monthlyProgress"
                    ></div>

                </div>

            </div>


            <div class="progress-box">

                <div class="progress-header">

                    <span>
                        کارهای انجام‌شده
                    </span>

                    <strong id="monthlyCompleted">
                        0
                    </strong>

                </div>

            </div>

        </div>



        <!-- CALENDAR -->

        <div
            class="panel"
            id="calendarPanel"
        >

            <div class="panel-title">

                <h2>
                    تقویم
                </h2>

            </div>


            <div
                class="calendar"
                id="calendar"
            ></div>

        </div>



        <!-- HABITS -->

        <div
            class="panel"
            id="habitsPanel"
        >

            <div class="panel-title">

                <h2>
                    عادت‌های من
                </h2>

            </div>


            <div
                class="habits"
                id="habits"
            >


                <div class="habit">

                    <div class="habit-top">

                        <span>
                            برنامه‌ریزی روزانه
                        </span>

                        <strong id="habit1Percent">
                            0%
                        </strong>

                    </div>


                    <div class="habit-bar">

                        <div
                            id="habit1Bar"
                        ></div>

                    </div>

                </div>



                <div class="habit">

                    <div class="habit-top">

                        <span>
                            انجام کارهای مهم
                        </span>

                        <strong id="habit2Percent">
                            0%
                        </strong>

                    </div>


                    <div class="habit-bar">

                        <div
                            id="habit2Bar"
                        ></div>

                    </div>

                </div>


            </div>

        </div>


    </section>

</main>



<!-- =======================================================
     MODAL
     ======================================================= -->

<div
    class="modal"
    id="taskModal"
>

    <div class="modal-box">

        <h2>
            افزودن کار جدید
        </h2>


        <input
            type="text"
            id="taskInput"
            placeholder="مثلاً: مطالعه ۳۰ دقیقه"
            autocomplete="off"
        >


        <div class="modal-actions">

            <button
                class="primary-btn"
                onclick="addTask()"
            >
                افزودن
            </button>


            <button
                class="primary-btn"
                style="background:#eee;color:#222"
                onclick="closeModal()"
            >
                لغو
            </button>

        </div>

    </div>

</div>



<script>

/* =========================================================
   DATA
   ========================================================= */

let tasks = JSON.parse(
    localStorage.getItem("dreamPlannerTasks") || "[]"
);

let activeDays = Number(
    localStorage.getItem("dreamPlannerActiveDays") || 0
);


/* =========================================================
   THEME ANIMATION CONTROL
   ========================================================= */

let themeAnimating = false;


/* =========================================================
   DATE
   ========================================================= */

function updateDate(){

    const now = new Date();

    const options = {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
    };

    document.getElementById(
        "currentDate"
    ).textContent =
        now.toLocaleDateString(
            "fa-IR",
            options
        );
}


/* =========================================================
   SAVE
   ========================================================= */

function saveData(){

    localStorage.setItem(
        "dreamPlannerTasks",
        JSON.stringify(tasks)
    );

    localStorage.setItem(
        "dreamPlannerActiveDays",
        activeDays
    );
}


/* =========================================================
   RENDER TASKS
   ========================================================= */

function renderTasks(){

    const list =
        document.getElementById("taskList");


    if(tasks.length === 0){

        list.innerHTML = `
            <div class="empty">
                هنوز کاری اضافه نکرده‌ای
            </div>
        `;

        updateStats();

        return;
    }


    list.innerHTML = "";


    tasks.forEach((task,index)=>{

        const item =
            document.createElement("div");


        item.className =
            "task " +
            (task.done ? "done" : "");


        item.innerHTML = `

            <input
                type="checkbox"
                ${task.done ? "checked" : ""}
                onchange="toggleTask(${index})"
            >

            <div class="task-text">
                ${escapeHTML(task.text)}
            </div>

            <button
                onclick="deleteTask(${index})"
                style="
                    border:0;
                    background:none;
                    color:#999;
                    cursor:pointer;
                    font-size:18px;
                "
                aria-label="حذف"
            >
                ×
            </button>

        `;


        list.appendChild(item);

    });


    updateStats();
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   ADD TASK
   ========================================================= */

function addTask(){

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();


    if(!text){

        input.focus();

        return;
    }


    tasks.push({

        text:text,

        done:false,

        date:new Date().toISOString()

    });


    input.value = "";


    saveData();

    renderTasks();

    closeModal();
}


/* =========================================================
   TOGGLE TASK
   ========================================================= */

function toggleTask(index){

    tasks[index].done =
        !tasks[index].done;


    saveData();

    renderTasks();
}


/* =========================================================
   DELETE TASK
   ========================================================= */

function deleteTask(index){

    tasks.splice(index,1);

    saveData();

    renderTasks();
}


/* =========================================================
   STATS
   ========================================================= */

function updateStats(){

    const total =
        tasks.length;


    const completed =
        tasks.filter(
            t=>t.done
        ).length;


    const percent =
        total === 0
        ? 0
        : Math.round(
            (completed / total) * 100
        );


    document.getElementById(
        "totalTasks"
    ).textContent = total;


    document.getElementById(
        "completedTasks"
    ).textContent = completed;


    document.getElementById(
        "completionPercent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "monthlyPercent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "monthlyProgress"
    ).style.width =
        percent + "%";


    document.getElementById(
        "monthlyCompleted"
    ).textContent =
        completed;


    document.getElementById(
        "activeDays"
    ).textContent =
        activeDays;


    document.getElementById(
        "habit1Percent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "habit1Bar"
    ).style.width =
        percent + "%";


    document.getElementById(
        "habit2Percent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "habit2Bar"
    ).style.width =
        percent + "%";
}


/* =========================================================
   MODAL
   ========================================================= */

function openModal(){

    document
        .getElementById("taskModal")
        .classList.add("show");


    setTimeout(()=>{

        document
            .getElementById("taskInput")
            .focus();

    },100);
}


function closeModal(){

    document
        .getElementById("taskModal")
        .classList.remove("show");
}


/* =========================================================
   MODAL CLICK
   ========================================================= */

document
    .getElementById("taskModal")
    .addEventListener(
        "click",
        function(e){

            if(e.target === this){

                closeModal();

            }

        }
    );


/* =========================================================
   ENTER / ESCAPE
   ========================================================= */

document
    .getElementById("taskInput")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){

                addTask();

            }

            if(e.key === "Escape"){

                closeModal();

            }

        }
    );


/* =========================================================
   CALENDAR
   ========================================================= */

function generateCalendar(){

    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    const names = [

        "ش",
        "ی",
        "د",
        "س",
        "چ",
        "پ",
        "ج"

    ];


    names.forEach(name=>{

        const div =
            document.createElement("div");


        div.className =
            "day-name";


        div.textContent =
            name;


        calendar.appendChild(div);

    });


    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        now.getMonth();


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for(
        let i=0;
        i<firstDay;
        i++
    ){

        const empty =
            document.createElement("div");

        calendar.appendChild(empty);

    }


    for(
        let day=1;
        day<=days;
        day++
    ){

        const div =
            document.createElement("div");


        div.className =
            "day";


        div.textContent =
            day;


        if(
            day === now.getDate()
        ){

            div.classList.add(
                "today"
            );

        }


        div.onclick = ()=>{

            document
                .querySelectorAll(
                    ".calendar .selected"
                )
                .forEach(
                    x=>
                        x.classList.remove(
                            "selected"
                        )
                );


            div.classList.add(
                "selected"
            );

        };


        calendar.appendChild(div);

    }
}


/* =========================================================
   SECTION NAVIGATION
   ========================================================= */

function showSection(section){

    document
        .querySelectorAll(
            ".menu button"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    if(section === "dashboard"){

        window.scrollTo({

            top:0,

            behavior:"smooth"

        });


        document
            .querySelector(
                ".menu button:nth-child(1)"
            )
            .classList.add(
                "active"
            );
    }


    if(section === "tasks"){

        document
            .getElementById(
                "tasksPanel"
            )
            .scrollIntoView({

                behavior:"smooth"

            });


        document
            .querySelector(
                ".menu button:nth-child(2)"
            )
            .classList.add(
                "active"
            );
    }


    if(section === "calendar"){

        document
            .getElementById(
                "calendarPanel"
            )
            .scrollIntoView({

                behavior:"smooth"

            });


        document
            .querySelector(
                ".menu button:nth-child(3)"
            )
            .classList.add(
                "active"
            );
    }


    if(section === "habits"){

        document
            .getElementById(
                "habitsPanel"
            )
            .scrollIntoView({

                behavior:"smooth"

            });


        document
            .querySelector(
                ".menu button:nth-child(4)"
            )
            .classList.add(
                "active"
            );
    }
}


/* =========================================================
   THEME
   ========================================================= */

function toggleTheme(){

    if(themeAnimating){

        return;
    }


    themeAnimating = true;


    const transition =
        document.getElementById(
            "themeTransition"
        );


    const isDark =
        document.body.classList.contains(
            "dark"
        );


    const goingDark =
        !isDark;


    /*
       اگر داریم وارد دارک مود می‌شویم:
       رنگ‌های تیره از روی صفحه پخش می‌شوند.
    */

    transition.classList.remove(
        "dark-paint",
        "light-paint"
    );


    if(goingDark){

        transition.classList.add(
            "dark-paint"
        );

    }else{

        transition.classList.add(
            "light-paint"
        );

    }


    /*
       شروع انیمیشن
    */

    transition.classList.add(
        "active"
    );


    /*
       وسط انیمیشن،
       تم اصلی صفحه عوض می‌شود.
    */

    setTimeout(()=>{

        document.body.classList.toggle(
            "dark"
        );


        localStorage.setItem(
            "dreamPlannerDark",
            document.body.classList.contains(
                "dark"
            )
        );

    },1250);


    /*
       بعد از تمام شدن رنگ،
       لایه مخفی می‌شود.
    */

    setTimeout(()=>{

        transition.classList.remove(
            "active"
        );

    },3000);


    setTimeout(()=>{

        transition.classList.remove(
            "dark-paint",
            "light-paint"
        );


        themeAnimating = false;

    },3400);
}


/* =========================================================
   LOAD THEME
   ========================================================= */

function loadTheme(){

    const dark =
        localStorage.getItem(
            "dreamPlannerDark"
        );


    if(dark === "true"){

        document.body.classList.add(
            "dark"
        );

    }
}


/* =========================================================
   START
   ========================================================= */

updateDate();

renderTasks();

generateCalendar();

loadTheme();


/* =========================================================
   UPDATE DATE EVERY MINUTE
   ========================================================= */

setInterval(
    updateDate,
    60000
);

</script>

</body>
</html>
